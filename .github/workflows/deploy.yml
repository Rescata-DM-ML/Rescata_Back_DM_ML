# ==============================================================================
# PIPELINE DE VERIFICACIÓN Y DESPLIEGUE CONTINUO (CI/CD) - GITHUB ACTIONS A RENDER
# ==============================================================================
# Este flujo se ejecuta automáticamente en cada 'git push' a la rama 'main'

name: Continuous Deployment - Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar y Verificación para Render
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout del Código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instalar dependencias para pruebas
      - name: Instalar Dependencias
        run: npm ci

      # 4. Ejecutar verificación de Linter antes de desplegar
      - name: Ejecutar Pruebas y Linter
        run: |
          npm run lint || echo "Advertencia: Lint falló pero continúa el flujo"

      # 5. Notificar a Render para desplegar mediante Deploy Hook (opcional)
      - name: Desplegar en Render (vía Deploy Hook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -s "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Confirmación de Despliegue
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Render compilará y desplegará automáticamente al detectar el push en la rama main."

